<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3"/>

  <!-- Bass Headstock / Fretboard Motif -->
  <g transform="translate(60, 40)">
    <!-- 4 Horizontal Tab Lines (G, D, A, E) -->
    <line x1="20" y1="120" x2="372" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="20" y1="180" x2="372" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
    <line x1="20" y1="240" x2="372" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <line x1="20" y1="300" x2="372" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>

    <!-- Clef TAB text -->
    <text x="35" y="165" fill="#38bdf8" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="2">T</text>
    <text x="35" y="225" fill="#38bdf8" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="2">A</text>
    <text x="35" y="285" fill="#38bdf8" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="2">B</text>

    <!-- Fret Nodes Glowing -->
    <circle cx="150" cy="300" r="18" fill="#0f172a" stroke="#06b6d4" stroke-width="4" filter="url(#glow)"/>
    <text x="150" y="306" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">3</text>

    <circle cx="220" cy="240" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="4" filter="url(#glow)"/>
    <text x="220" y="246" fill="#60a5fa" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">5</text>

    <circle cx="290" cy="180" r="18" fill="#0f172a" stroke="#8b5cf6" stroke-width="4" filter="url(#glow)"/>
    <text x="290" y="246" fill="#a78bfa" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle" y="186">5</text>

    <circle cx="350" cy="120" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="4" filter="url(#glow)"/>
    <text x="350" y="126" fill="#f472b6" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">7</text>

    <!-- Sound Waveform at bottom -->
    <path d="M 20 370 Q 70 320 120 370 T 220 370 T 320 370 T 372 370" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
